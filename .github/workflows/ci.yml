name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
      - name: Build library (with network)
        run: alr -n build
      - name: Build library (BEACON_NETWORK=no, the embedded profile)
        run: BEACON_NETWORK=no alr -n build
      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/queue_tests
          ./bin/topic_tests
          ./bin/wire_tests
          ./bin/unchecked_access_tests
      - name: UART integration tests (virtual serial ports)
        run: |
          sudo apt-get update
          sudo apt-get install -y socat

          socat \
            PTY,raw,echo=0,link=/tmp/beacon-tx \
            PTY,raw,echo=0,link=/tmp/beacon-rx &
          SOCAT_PID=$!

          trap 'kill $SOCAT_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 50); do
            if [ -e /tmp/beacon-tx ] && [ -e /tmp/beacon-rx ]; then
              break
            fi
            sleep 0.1
          done

          cd tests
          ./bin/uart_tests /tmp/beacon-tx /tmp/beacon-rx
      - name: UART bridge CRC integration test
        run: |
          cd demo
          alr -n build

          socat \
            PTY,raw,echo=0,link=/tmp/beacon-crc-tx \
            PTY,raw,echo=0,link=/tmp/beacon-crc-rx &
          SOCAT_PID=$!

          trap 'kill $SOCAT_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 50); do
            if [ -e /tmp/beacon-crc-tx ] && [ -e /tmp/beacon-crc-rx ]; then
              break
            fi
            sleep 0.1
          done

          ./bin/uart_crc_test /tmp/beacon-crc-tx /tmp/beacon-crc-rx
      - name: In-process demo (reliable never drops, best-effort keeps newest)
        run: |
          cd demo
          alr -n build
          ./bin/inproc_demo
      - name: UDP demo, two processes on loopback
        run: |
          cd demo
          ./bin/net_subscriber 239.255.0.1 5000 3 > sub.log &
          sleep 0.5
          ./bin/net_publisher 239.255.0.1 5000 200
          wait
          cat sub.log
          grep -q "done, 200 readings" sub.log
      - name: SPARK flow analysis
        run: |
          alr -n with gnatprove
          alr -n exec -- gnatprove -P beacon.gpr --mode=flow --checks-as-errors=on
